name: GTA 6 Auto Highlight Clipper

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Stream ya Video ka URL'
        required: true
        type: string
      num_clips:
        description: 'Kitni clips banani hain?'
        required: false
        default: '3'
        type: string

jobs:
  auto-clip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Deno (Unlocks YouTube Video Formats)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install --upgrade "yt-dlp[default]" numpy

      - name: Create Cookies File from Secret
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Run Auto Highlight Detection
        run: |
          python autodetect.py "${{ inputs.video_url }}" "${{ inputs.num_clips }}"

      - name: Clean Cookies
        if: always()
        run: |
          rm -f cookies.txt

      - name: Upload Video Clips
        uses: actions/upload-artifact@v4
        with:
          name: gta6_viral_clips
          path: clips/*.mp4
          retention-days: 7
